<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not authorized &middot; CASA Volunteer Tracker</title>
  <link rel="icon" href="/favicon.ico">
  <!-- Static (served straight from public/, shown even when Rails is down), so the design-system
       look — slate surface, indigo brand accent, one centered card — is inlined with hardcoded hex. -->
  <style>
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh; padding: 1.5rem;
      display: flex; align-items: center; justify-content: center;
      background: #f8fafc; color: #1e293b;
      font-family: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased; line-height: 1.6;
    }
    .wrap { width: 100%; max-width: 30rem; }
    .brand { text-align: center; color: #4f46e5; font-weight: 700; font-size: .9375rem; letter-spacing: -.01em; margin: 0 0 1rem; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 1rem; box-shadow: 0 1px 2px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.05); overflow: hidden; }
    .accent { height: .375rem; background: linear-gradient(90deg, #4338ca, #4f46e5); }
    .card-body { padding: 2.25rem 2rem 2rem; text-align: center; }
    .code { margin: 0; font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #4f46e5; }
    h1 { margin: .5rem 0 0; font-size: 1.5rem; font-weight: 800; letter-spacing: -.015em; color: #0f172a; }
    .msg { margin: .625rem 0 0; color: #475569; font-size: .9375rem; }
    .note { margin: .75rem 0 0; color: #64748b; font-size: .8125rem; }
    .actions { margin-top: 1.75rem; display: flex; flex-wrap: wrap; gap: .75rem 1rem; justify-content: center; align-items: center; }
    .btn { display: inline-flex; align-items: center; height: 2.5rem; padding: 0 1.125rem; border-radius: .5rem; background: #4f46e5; color: #fff; font-size: .875rem; font-weight: 600; text-decoration: none; }
    .btn:hover { background: #4338ca; }
    .link { color: #64748b; font-size: .875rem; text-decoration: none; }
    .link:hover { color: #334155; text-decoration: underline; }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="brand">CASA Volunteer Tracker</p>
    <div class="card">
      <div class="accent"></div>
      <div class="card-body">
        <p class="code">Error 403</p>
        <h1>Not authorized</h1>
        <p class="msg">Sorry, you are not authorized to perform this action.</p>
        
        <div class="actions"><a class="btn" href="/">Back to homepage</a></div>
      </div>
    </div>
  </main>
</body>
</html>
