default: &default
  adapter: postgresql
  encoding: unicode
  username: <%= ENV.fetch("POSTGRES_USER") { } %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 3 } %>
  port: <%= ENV.fetch("POSTGRES_PORT", "5432") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { 'password' } %>


development:
  <<: *default
  database: casa_development
  host: <%= ENV.fetch("DATABASE_HOST") { } %>

test:
  <<: *default
  database: casa_test<%= ENV["TEST_ENV_NUMBER"] %>
  host: <%= ENV.fetch("DATABASE_HOST") { } %>

production:
  <<: *default
  database: casa_production
  username: casa
  password: <%= ENV['CASA_DATABASE_PASSWORD'] %>
  # Fail fast when Postgres is unreachable (restart/maintenance/failover -> "connection refused")
  # instead of holding a Puma thread while the OS TCP timeout runs. pool already matches
  # RAILS_MAX_THREADS via *default; checkout_timeout defaults to 5s and reconnect is on.
  connect_timeout: 5
