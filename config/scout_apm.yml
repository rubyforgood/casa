# This configuration file is used for Scout APM.
# https://scoutapm.com/docs/ruby/configuration
common: &defaults

  # key: Your Organization key for Scout APM. Found on the settings screen.
  # - Default: none
  key: <%= ENV.fetch("SCOUT_APM_KEY", "local") %>

  # log_level: Verboseness of logs.
  # - Default: 'info'
  # - Valid Options: debug, info, warn, error
  # log_level: debug

  # name: Application name in APM Web UI
  # - Default: the application names comes from the Rails or Sinatra class name
  # name:

  # monitor: Enable Scout APM or not
  # - Default: none
  # - Valid Options: true, false
  monitor: true

production:
  <<: *defaults
  errors_enabled: true
  # Replaces Scout's default list (the first two). InvalidType is scanner noise from junk
  # Accept/Content-Type headers; Rails already answers it with a 406.
  errors_ignored_exceptions:
    - ActiveRecord::RecordNotFound
    - ActionController::RoutingError
    - ActionDispatch::Http::MimeNegotiation::InvalidType

development:
  <<: *defaults
  monitor: false
  dev_trace: true

test:
  <<: *defaults
  monitor: false

staging:
  <<: *defaults
  dev_trace: true
