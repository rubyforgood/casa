name: Mark stale issues and pull requests

on:
  schedule:
  - cron: "30 1 * * *"

jobs:
  stale:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-issue-message: "This issue hasn't had activity in a while. If you're working on it, please leave a quick update to keep it active. If you'd like to pick it up, comment and a maintainer will assign you."
        stale-pr-message: "This PR has been open for a long time without any pushes or comments! What's up?"
        stale-issue-label: 'no-issue-activity'
        stale-pr-label: 'no-pr-activity'
        exempt-issue-labels: "Help Wanted,Good First Issue,🗺️ Epic,Stakeholder-Feature"
        exempt-all-issue-assignees: false
        days-before-issue-close: -1
        days-before-pr-close: 30
